<?xml version="1.0" encoding="UTF-8"?>
<!--
  The App Store icon, 1024 x 1024: the launcher mark on the launcher's black.

  The same three arcs as play/graphics/icon.svg and the Android launcher
  (app/src/main/res/drawable/ic_launcher_foreground.xml): fifteen squats, ten push-ups and five
  pull-ups, at 270, 180 and 90 degrees of a circle, with the same widths, round caps and opacities.
  A full-bleed square with no corners, shadow or transparency of its own, because iOS rounds it, and
  the App Store refuses an icon with an alpha channel. The mark fills about two thirds of the
  square, well inside the margin the rounding leaves.

  Rendered to icon.png by tools/play/render_graphics.py (the appstore store), and copied into the app's
  asset catalog as AppIcon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="12 12 84 84">
  <rect x="12" y="12" width="84" height="84" fill="#000000"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <path d="M54,27 A27,27 0 1 1 27,54" stroke-opacity="0.302"/>
    <path d="M54,34 A20,20 0 0 1 74,54 A20,20 0 0 1 54,74" stroke-opacity="0.580"/>
    <path d="M54,41 A13,13 0 0 1 67,54" stroke-opacity="1"/>
  </g>
</svg>
